<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>لوحة الإدارة - نظام نتائج مدارس نيو فيجن الخاصة</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', 'Tahoma', Geneva, Verdana, sans-serif;
            min-height: 100vh;
            direction: rtl;
        }

        /* شريط التبويبات */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .logo-text {
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            font-size: 11px;
            color: #718096;
            margin-top: 2px;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-links button,
        .student-link {
            background: none;
            border: none;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s;
            color: #4a5568;
            text-decoration: none;
        }

        .nav-links button:hover,
        .student-link:hover {
            background: #ff8c00;
            color: white;
            transform: translateY(-2px);
        }

        .nav-links button.active {
            background: linear-gradient(135deg, #ff8c00, #ffd700);
            color: white;
        }

        .student-link {
            background: #27ae60;
            color: white;
        }

        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* البطاقات */
        .card {
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-bottom: 25px;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card-header {
            background: linear-gradient(135deg, #2c3e50, #1a2a3a);
            color: white;
            padding: 18px 24px;
            font-size: 18px;
            font-weight: bold;
        }

        .card-body {
            padding: 24px;
        }

        /* النماذج */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3748;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #ff8c00;
            box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        /* الأزرار */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2c3e50, #1a2a3a);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #ff8c00, #ffd700);
            color: #2c3e50;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #219a52;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .btn-warning:hover {
            background: #e67e22;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .btn-info {
            background: #3498db;
            color: white;
        }

        .btn-info:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn-json {
            background: #8e44ad;
            color: white;
        }

        .btn-json:hover {
            background: #6c3483;
            transform: translateY(-2px);
        }

        /* الإحصائيات */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .stat-box:hover {
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .stat-label {
            color: #718096;
            font-size: 13px;
            margin-top: 8px;
        }

        /* الفلاتر */
        .filter-bar {
            background: white;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .filter-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            align-items: flex-end;
        }

        /* الإجراءات الجماعية */
        .bulk-actions {
            background: white;
            padding: 15px 20px;
            border-radius: 20px;
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        /* بطاقات الطلاب */
        .student-card {
            background: white;
            border-radius: 20px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .student-card-header {
            background: linear-gradient(135deg, #2c3e50, #1a2a3a);
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            cursor: pointer;
        }

        .student-card-header:hover {
            background: linear-gradient(135deg, #ff8c00, #ffd700);
        }

        .student-info {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
        }

        .student-name {
            font-size: 18px;
            font-weight: bold;
        }

        .student-detail {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .badge-count {
            background: #e74c3c;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .student-card-body {
            display: none;
            padding: 20px;
            overflow-x: auto;
        }

        .student-card.expanded .student-card-body {
            display: block;
        }

        .expand-icon {
            font-size: 20px;
            transition: transform 0.3s;
        }

        .student-card.expanded .expand-icon {
            transform: rotate(180deg);
        }

        /* الجداول */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }

        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }

        .data-table th {
            background: #f7fafc;
            font-weight: 600;
        }

        .checkbox-col {
            width: 40px;
        }

        .checkbox-col input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* الشارات */
        .badge-visible {
            background: #27ae60;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .badge-hidden {
            background: #e74c3c;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .badge-empty {
            background: #f59e0b;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .badge-added {
            background: #27ae60;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .badge-not-added {
            background: #f59e0b;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .toggle-link {
            background: #e0e7ff;
            border: none;
            padding: 4px 12px;
            border-radius: 10px;
            cursor: pointer;
            margin: 0 3px;
        }

        .toggle-link:hover {
            background: #c7d2fe;
        }

        /* رسائل التنبيه */
        .alert {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 12px;
            color: white;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .alert-success {
            background: #27ae60;
        }

        .alert-error {
            background: #e74c3c;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* شاشة تسجيل الدخول */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .login-card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .login-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
        }

        .login-title {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
        }

        .login-sub {
            color: #718096;
            font-size: 13px;
            margin: 10px 0 25px;
        }

        .login-input {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 5px;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .login-input:focus {
            outline: none;
            border-color: #ff8c00;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2c3e50, #1a2a3a);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #ff8c00, #ffd700);
            color: #2c3e50;
        }

        /* تذييل الصفحة */
        .footer {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 30px;
        }

        .footer a {
            color: #ffd700;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .filter-form {
                grid-template-columns: 1fr;
            }

            .export-buttons {
                justify-content: stretch;
            }

            .export-buttons .btn {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ========================
        // نظام المصادقة
        // ========================
        const Auth = {
            defaultPassword: '1234',
            storageKey: 'admin_session',

            checkAuth() {
                const session = localStorage.getItem(this.storageKey);
                if (session) {
                    try {
                        const data = JSON.parse(session);
                        if (Date.now() < data.expires) {
                            return true;
                        }
                    } catch (e) { }
                }
                return false;
            },

            login(password) {
                const savedPass = localStorage.getItem('admin_password') || this.defaultPassword;
                if (password === savedPass) {
                    localStorage.setItem(this.storageKey, JSON.stringify({
                        expires: Date.now() + (8 * 60 * 60 * 1000)
                    }));
                    return true;
                }
                return false;
            },

            changePassword(oldPass, newPass) {
                const currentPass = localStorage.getItem('admin_password') || this.defaultPassword;
                if (oldPass === currentPass && newPass && newPass.length >= 4) {
                    localStorage.setItem('admin_password', newPass);
                    return true;
                }
                return false;
            },

            logout() {
                localStorage.removeItem(this.storageKey);
                window.location.reload();
            },

            showLogin() {
                const overlay = document.createElement('div');
                overlay.className = 'login-overlay';
                overlay.innerHTML = `
                    <div class="login-card">
                        <div class="login-logo">🔐</div>
                        <div class="login-title">لوحة الإدارة</div>
                        <div class="login-sub">مدارس نيو فيجن الخاصة</div>
                        <input type="password" id="loginPass" class="login-input" placeholder="••••" maxlength="10">
                        <button id="loginBtn" class="login-btn">دخول</button>
                        <button id="changePassBtn" style="margin-top:10px;background:none;border:none;color:#ff8c00;cursor:pointer;">🔑 تغيير كلمة المرور</button>
                        <div id="loginError" style="color:#e74c3c;font-size:12px;margin-top:10px;display:none;"></div>
                    </div>
                `;
                document.body.appendChild(overlay);

                const loginPass = document.getElementById('loginPass');
                const loginBtn = document.getElementById('loginBtn');
                const changeBtn = document.getElementById('changePassBtn');
                const errorDiv = document.getElementById('loginError');

                const attemptLogin = () => {
                    if (this.login(loginPass.value)) {
                        overlay.remove();
                        location.reload();
                    } else {
                        errorDiv.textContent = '⚠️ كلمة المرور غير صحيحة';
                        errorDiv.style.display = 'block';
                        loginPass.value = '';
                        loginPass.focus();
                    }
                };

                loginBtn.onclick = attemptLogin;
                loginPass.onkeypress = (e) => { if (e.key === 'Enter') attemptLogin(); };

                changeBtn.onclick = () => {
                    const oldPass = prompt('🔐 كلمة المرور الحالية:');
                    if (!oldPass) return;
                    const newPass = prompt('🔐 كلمة المرور الجديدة (4 أرقام أو أكثر):');
                    if (!newPass || newPass.length < 4) {
                        alert('⚠️ كلمة المرور الجديدة يجب أن تكون 4 أرقام أو أكثر');
                        return;
                    }
                    const confirmPass = prompt('🔐 تأكيد كلمة المرور الجديدة:');
                    if (newPass !== confirmPass) {
                        alert('⚠️ كلمة المرور غير متطابقة');
                        return;
                    }
                    if (this.changePassword(oldPass, newPass)) {
                        alert('✅ تم تغيير كلمة المرور بنجاح');
                    } else {
                        alert('❌ كلمة المرور الحالية غير صحيحة');
                    }
                };

                loginPass.focus();
            }
        };

        // ========================
        // التطبيق الرئيسي
        // ========================
        const App = {
            students: [],
            results: [],
            currentTab: 'dashboard',
            filters: {
                grade: '',
                semester: '',
                year: '',
                hideFilter: 'all',
                search: ''
            },

            gradeLevels: [
                { id: 1, name: 'KG1' },
                { id: 2, name: 'KG2' },
                { id: 3, name: 'الصف الأول الابتدائي' },
                { id: 4, name: 'الصف الثاني الابتدائي' },
                { id: 5, name: 'الصف الثالث الابتدائي' },
                { id: 6, name: 'الصف الرابع الابتدائي' },
                { id: 7, name: 'الصف الخامس الابتدائي' },
                { id: 8, name: 'الصف السادس الابتدائي' },
                { id: 9, name: 'الصف الأول الإعدادي' },
                { id: 10, name: 'الصف الثاني الإعدادي' },
                { id: 11, name: 'الصف الثالث الإعدادي' },
                { id: 12, name: 'الصف الأول الثانوي' },
                { id: 13, name: 'الصف الثاني الثانوي' },
                { id: 14, name: 'الصف الثالث الثانوي' }
            ],

            // تهيئة التطبيق
            init() {
                // تفريغ البيانات القديمة بالكامل
                this.clearAllData();

                if (!Auth.checkAuth()) {
                    Auth.showLogin();
                    return;
                }
                this.loadData();
                this.render();
            },

            // تفريغ جميع البيانات المحملة سابقاً
            clearAllData() {
                localStorage.removeItem('neovision_students');
                localStorage.removeItem('neovision_results');
                localStorage.removeItem('neovision_uploads');
                console.log('🗑️ تم تفريغ جميع البيانات القديمة');
            },

            loadData() {
                const students = localStorage.getItem('neovision_students');
                const results = localStorage.getItem('neovision_results');

                if (students) this.students = JSON.parse(students);
                if (results) this.results = JSON.parse(results);

                console.log('📊 تم تحميل:', this.students.length, 'طالب،', this.results.length, 'نتيجة');
            },

            saveData() {
                localStorage.setItem('neovision_students', JSON.stringify(this.students));
                localStorage.setItem('neovision_results', JSON.stringify(this.results));
                this.showMessage('💾 تم حفظ البيانات', 'success');
            },

            showMessage(msg, type = 'success') {
                const existingAlert = document.querySelector('.alert');
                if (existingAlert) existingAlert.remove();

                const alert = document.createElement('div');
                alert.className = `alert alert-${type}`;
                alert.textContent = msg;
                document.body.appendChild(alert);

                setTimeout(() => alert.remove(), 3000);
            },

            // ========================
            // رفع ملف Excel
            // ========================
            uploadExcel(file, gradeId, semester, year) {
                if (!file) {
                    this.showMessage('❌ الرجاء اختيار ملف', 'error');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

                        if (!rows || rows.length < 2) {
                            this.showMessage('❌ الملف فارغ', 'error');
                            return;
                        }

                        // البحث عن الأعمدة المطلوبة
                        const headers = rows[0];
                        let nationalCol = -1, nameCol = -1;

                        for (let i = 0; i < headers.length; i++) {
                            const col = String(headers[i] || '');
                            if (col.includes('الرقم القومي') || col.includes('رقم قومي')) nationalCol = i;
                            if (col.includes('اسم الطالب') || col.includes('اسم')) nameCol = i;
                        }

                        if (nationalCol === -1 || nameCol === -1) {
                            this.showMessage('❌ يجب وجود عمود "الرقم القومي" و "اسم الطالب"', 'error');
                            return;
                        }

                        // جمع المواد
                        const subjects = [];
                        for (let i = 0; i < headers.length; i++) {
                            if (i !== nationalCol && i !== nameCol) {
                                const subjectName = String(headers[i] || '').trim();
                                if (subjectName) subjects.push({ index: i, name: subjectName });
                            }
                        }

                        let newStudentsCount = 0;
                        let newResultsCount = 0;

                        for (let i = 1; i < rows.length; i++) {
                            const row = rows[i];
                            if (!row) continue;

                            const nationalId = String(row[nationalCol] || '').trim();
                            const studentName = String(row[nameCol] || '').trim();

                            if (!nationalId || !studentName) continue;
                            if (nationalId.length !== 14 || isNaN(nationalId)) continue;

                            // البحث عن الطالب أو إضافته
                            let student = this.students.find(s => s.nationalId === nationalId);
                            if (!student) {
                                student = {
                                    id: Date.now() + Math.random(),
                                    nationalId: nationalId,
                                    name: studentName,
                                    grade_level_id: parseInt(gradeId),
                                    academic_year: year,
                                    seatNumber: ''
                                };
                                this.students.push(student);
                                newStudentsCount++;
                            }

                            // إضافة النتائج
                            subjects.forEach((subject, idx) => {
                                let grade = String(row[subject.index] || '').trim();
                                if (!grade) grade = '—';

                                this.results.push({
                                    id: Date.now() + Math.random() + idx + i,
                                    student_id: student.id,
                                    grade_level_id: parseInt(gradeId),
                                    subject_name: subject.name,
                                    subject_grade: grade,
                                    semester: semester,
                                    academic_year: year,
                                    is_hidden: false,
                                    is_empty: (grade === '—'),
                                    is_added_to_total: true,
                                    display_order: idx
                                });
                                newResultsCount++;
                            });
                        }

                        if (newResultsCount === 0) {
                            this.showMessage('❌ لم يتم العثور على بيانات صالحة', 'error');
                            return;
                        }

                        this.saveData();
                        this.showMessage(`✅ تم رفع ${newResultsCount} مادة لـ ${newStudentsCount} طالب`);
                        this.render();

                    } catch (err) {
                        this.showMessage('❌ خطأ: ' + err.message, 'error');
                    }
                };
                reader.readAsArrayBuffer(file);
            },

            // ========================
            // تصدير قائمة المواد
            // ========================
            exportSubjectsList() {
                const gradeId = document.getElementById('subjectsGrade').value;
                const semester = document.getElementById('subjectsSemester').value;
                const year = document.getElementById('subjectsYear').value;

                if (!gradeId) {
                    this.showMessage('❌ اختر المرحلة', 'error');
                    return;
                }

                const filtered = this.results.filter(r =>
                    r.grade_level_id == gradeId &&
                    r.semester === semester &&
                    r.academic_year === year
                );

                if (filtered.length === 0) {
                    this.showMessage('❌ لا توجد مواد للمرحلة المحددة', 'error');
                    return;
                }

                // استخراج المواد الفريدة
                const unique = new Map();
                filtered.forEach(r => {
                    if (!unique.has(r.subject_name)) {
                        unique.set(r.subject_name, r.is_added_to_total);
                    }
                });

                const data = [];
                for (let [name, added] of unique) {
                    data.push({
                        'المادة': name,
                        'مضافة للمجموع': added ? 'نعم' : 'لا'
                    });
                }

                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'المواد');

                const gradeName = this.gradeLevels.find(g => g.id == gradeId)?.name || gradeId;
                XLSX.writeFile(wb, `مواد_${gradeName}.xlsx`);

                this.showMessage(`✅ تم تصدير ${data.length} مادة`);
            },

            // ========================
            // رفع ملف التحديد وتطبيق التغييرات
            // ========================
            uploadSubjectsUpdate(file) {
                if (!file) {
                    this.showMessage('❌ اختر ملف التحديد أولاً', 'error');
                    return;
                }

                const gradeId = document.getElementById('updateGrade').value;
                const semester = document.getElementById('updateSemester').value;
                const year = document.getElementById('updateYear').value;

                if (!gradeId) {
                    this.showMessage('❌ اختر المرحلة', 'error');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(sheet);

                        if (!rows || rows.length === 0) {
                            this.showMessage('❌ الملف فارغ', 'error');
                            return;
                        }

                        // بناء خريطة التحديثات
                        const updateMap = new Map();
                        rows.forEach(row => {
                            const subjectName = row['المادة'] || Object.keys(row)[0];
                            let isAdded = row['مضافة للمجموع'] || row['مضافة'] || Object.values(row)[1];

                            if (subjectName && isAdded !== undefined) {
                                const isAddedBool = (isAdded === 'نعم' || isAdded === 'yes' || isAdded === true);
                                updateMap.set(String(subjectName).trim(), isAddedBool);
                            }
                        });

                        if (updateMap.size === 0) {
                            this.showMessage('❌ لم يتم العثور على بيانات صالحة', 'error');
                            return;
                        }

                        // تطبيق التحديثات
                        let updatedCount = 0;
                        this.results.forEach(result => {
                            if (result.grade_level_id == gradeId &&
                                result.semester === semester &&
                                result.academic_year === year) {

                                const newValue = updateMap.get(result.subject_name);
                                if (newValue !== undefined && result.is_added_to_total !== newValue) {
                                    result.is_added_to_total = newValue;
                                    updatedCount++;
                                }
                            }
                        });

                        this.saveData();
                        this.showMessage(`✅ تم تحديث ${updatedCount} نتيجة بنجاح`);
                        this.render();

                        // إعادة تعيين حقل الملف
                        const fileInput = document.getElementById('updateFile');
                        if (fileInput) fileInput.value = '';

                    } catch (err) {
                        this.showMessage('❌ خطأ: ' + err.message, 'error');
                    }
                };
                reader.readAsArrayBuffer(file);
            },

            // ========================
            // تصدير JSON للطلاب
            // ========================
            exportToJSON() {
                const visibleResults = this.results.filter(r => !r.is_hidden);

                const exportData = {
                    students: this.students.map(s => ({
                        id: s.id,
                        nationalId: s.nationalId,
                        name: s.name,
                        grade_level_id: s.grade_level_id,
                        academic_year: s.academic_year,
                        seatNumber: s.seatNumber || ''
                    })),
                    results: visibleResults.map(r => ({
                        student_id: r.student_id,
                        subject_name: r.subject_name,
                        subject_grade: r.subject_grade,
                        is_added_to_total: r.is_added_to_total,
                        semester: r.semester,
                        academic_year: r.academic_year
                    })),
                    exportDate: new Date().toISOString(),
                    totalStudents: this.students.length,
                    totalResults: visibleResults.length,
                    developer: "المهندس عادل عبدالرحمن",
                    school: "مدارس نيو فيجن الخاصة"
                };

                const jsonStr = JSON.stringify(exportData, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'data.json';
                a.click();
                URL.revokeObjectURL(url);

                this.showMessage(`✅ تم تحميل data.json - ${this.students.length} طالب، ${visibleResults.length} نتيجة`);
            },

            // ========================
            // إدارة النتائج
            // ========================
            toggleResult(resultId) {
                const result = this.results.find(r => r.id == resultId);
                if (result) {
                    result.is_hidden = !result.is_hidden;
                    this.saveData();
                    this.showMessage(`تم ${result.is_hidden ? 'إخفاء' : 'إظهار'} النتيجة`);
                    this.render();
                }
            },

            deleteResult(resultId) {
                if (confirm('هل أنت متأكد من حذف هذه النتيجة؟')) {
                    this.results = this.results.filter(r => r.id != resultId);
                    this.saveData();
                    this.showMessage('✅ تم حذف النتيجة');
                    this.render();
                }
            },

            bulkActions(action) {
                const checkboxes = document.querySelectorAll('.result-checkbox:checked');
                const ids = Array.from(checkboxes).map(cb => parseInt(cb.dataset.resultId));

                if (ids.length === 0) {
                    this.showMessage('❌ الرجاء تحديد النتائج أولاً', 'error');
                    return;
                }

                this.results.forEach(r => {
                    if (ids.includes(r.id)) r.is_hidden = (action === 'hide');
                });

                this.saveData();
                this.showMessage(`✅ تم ${action === 'hide' ? 'إخفاء' : 'إظهار'} ${ids.length} نتيجة`);
                this.render();
            },

            // ========================
            // الفلترة والبحث
            // ========================
            getFilteredResults() {
                let filtered = [...this.results];

                if (this.filters.grade && this.filters.grade !== '') {
                    filtered = filtered.filter(r => r.grade_level_id == this.filters.grade);
                }
                if (this.filters.semester && this.filters.semester !== '') {
                    filtered = filtered.filter(r => r.semester === this.filters.semester);
                }
                if (this.filters.year && this.filters.year !== '') {
                    filtered = filtered.filter(r => r.academic_year === this.filters.year);
                }
                if (this.filters.hideFilter === 'visible') {
                    filtered = filtered.filter(r => !r.is_hidden);
                }
                if (this.filters.hideFilter === 'hidden') {
                    filtered = filtered.filter(r => r.is_hidden);
                }

                return filtered;
            },

            getStudentsWithResults() {
                let filteredResults = this.getFilteredResults();

                if (this.filters.search && this.filters.search !== '') {
                    const studentIds = this.students.filter(s => s.name.includes(this.filters.search)).map(s => s.id);
                    filteredResults = filteredResults.filter(r => studentIds.includes(r.student_id));
                }

                const map = new Map();
                filteredResults.forEach(r => {
                    const student = this.students.find(s => s.id === r.student_id);
                    if (student) {
                        if (!map.has(student.id)) {
                            map.set(student.id, { ...student, results: [] });
                        }
                        map.get(student.id).results.push(r);
                    }
                });

                for (let student of map.values()) {
                    student.results.sort((a, b) => (a.display_order || 0) - (b.display_order || 0));
                }

                return Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name));
            },

            getStats() {
                return {
                    students: this.students.length,
                    results: this.results.length,
                    hidden: this.results.filter(r => r.is_hidden).length
                };
            },

                            </form>
                        </div>
                        <div class="card" style="padding: 40px; text-align: center;">
                            <div style="font-size: 48px;">🔍</div>
                            <div>لا توجد نتائج مطابقة لمعايير البحث</div>
                            <div style="color: #718096; margin-top: 10px;">اضغط "إعادة تعيين" لعرض الكل</div>
                        </div>
                    `;
                }

                if (studentsData.length === 0) {
                    return `
                        <div class="card" style="padding: 40px; text-align: center;">
                            <div style="font-size: 48px;">📭</div>
                            <div>لا توجد بيانات</div>
                            <div style="color: #718096;">تأكد من رفع ملفات النتائج أولاً</div>
                        </div>
                    `;
                }

                return `
                    <div class="stats-bar">
                        <div class="stat-box"><div class="stat-number">${studentsData.length}</div><div class="stat-label">👨‍🎓 عدد الطلاب</div></div>
                        <div class="stat-box"><div class="stat-number">${filtered.length}</div><div class="stat-label">📊 المواد المعروضة</div></div>
                        <div class="stat-box"><div class="stat-number" style="color:#27ae60;">${filtered.filter(r => !r.is_hidden).length}</div><div class="stat-label">✅ ظاهرة</div></div>
                        <div class="stat-box"><div class="stat-number" style="color:#e74c3c;">${filtered.filter(r => r.is_hidden).length}</div><div class="stat-label">🔒 محجوبة</div></div>
                    </div>

                    <div class="filter-bar">
                        <form class="filter-form" id="filterForm">
                            <div class="form-group"><label>المرحلة</label><select name="grade"><option value="">الكل</option>${gradeOptions}</select></div>
                            <div class="form-group"><label>الفصل</label><select name="semester"><option value="">الكل</option><option value="first" ${this.filters.semester === 'first' ? 'selected' : ''}>الأول</option><option value="second" ${this.filters.semester === 'second' ? 'selected' : ''}>الثاني</option></select></div>
                            <div class="form-group"><label>السنة</label><select name="year"><option value="">الكل</option>${availableYears.map(y => `<option value="${y}" ${this.filters.year === y ? 'selected' : ''}>${y}</option>`).join('')}</select></div>
                            <div class="form-group"><label>الحالة</label><select name="hideFilter"><option value="all" ${this.filters.hideFilter === 'all' ? 'selected' : ''}>الكل</option><option value="visible" ${this.filters.hideFilter === 'visible' ? 'selected' : ''}>الظاهرة</option><option value="hidden" ${this.filters.hideFilter === 'hidden' ? 'selected' : ''}>المخفية</option></select></div>
                            <div class="form-group"><label>بحث</label><input type="text" name="search" value="${this.escapeHtml(this.filters.search)}" placeholder="اسم الطالب"></div>
                            <div class="form-group"><button type="submit" class="btn btn-primary">🔍 بحث</button><button type="button" id="resetFilters" class="btn" style="background:#e2e8f0;">إعادة تعيين</button></div>
                        </form>
                    </div>

                    <div class="export-buttons">
                        <button id="exportExcelBtn" class="btn btn-success">📎 تصدير إلى Excel</button>
                        <button id="printAllBtn" class="btn btn-primary">🖨️ طباعة الكل</button>
                    </div>

                    <div class="bulk-actions">
                        <button id="bulkShowBtn" class="btn btn-success">✅ إظهار المحدد</button>
                        <button id="bulkHideBtn" class="btn btn-danger">🔒 إخفاء المحدد</button>
                        <label><input type="checkbox" id="selectAll"> تحديد الكل</label>
                    </div>

                    <div id="studentsContainer">
                        ${studentsData.map(student => {
                            const gradeName = this.gradeLevels.find(g => g.id == student.grade_level_id)?.name || '-';
                            const hiddenCount = student.results.filter(r => r.is_hidden).length;
                            const emptyCount = student.results.filter(r => r.is_empty).length;

                            return `
                                <div class="student-card">
                                    <div class="student-card-header" onclick="this.closest('.student-card').classList.toggle('expanded')">
                                        <div class="student-info">
                                            <div class="student-name">📚 ${this.escapeHtml(student.name)}</div>
                                            <div class="student-detail">${gradeName}</div>
                                            <div class="student-detail">📅 ${student.academic_year || '-'}</div>
                                            ${student.seatNumber ? `<div class="student-detail">🪑 ${this.escapeHtml(student.seatNumber)}</div>` : ''}
                                            ${hiddenCount > 0 ? `<div class="badge-count">🔒 ${hiddenCount}</div>` : ''}
                                            ${emptyCount > 0 ? `<div class="badge-count" style="background:#f59e0b;">⚠️ ${emptyCount}</div>` : ''}
                                        </div>
                                        <span class="expand-icon">▼</span>
                                    </div>
                                    <div class="student-card-body">
                                        <div style="overflow-x: auto;">
                                            <table class="data-table">
                                                <thead>
                                                    <tr>
                                                        <th class="checkbox-col"><input type="checkbox" class="group-checkbox" data-student="${student.id}"></th>
                                                        <th>📖 المادة</th>
                                                        <th>⭐ الدرجة</th>
                                                        <th>🔐 الحالة</th>
                                                        <th>📌 النوع</th>
                                                        <th>⚙️ إجراءات</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    ${student.results.map(result => {
                                                        const isEmpty = result.is_empty || result.subject_grade === "—";
                                                        const badgeClass = result.is_hidden ? 'badge-hidden' : (isEmpty ? 'badge-empty' : (result.is_added_to_total ? 'badge-visible' : 'badge-empty'));
                                                        const badgeText = result.is_hidden ? 'محجوبة' : (isEmpty ? 'فارغة' : (result.is_added_to_total ? 'مضافة' : 'غير مضافة'));

                                                        return `
                                                            <tr style="${!result.is_hidden && result.is_added_to_total ? 'background:#e6fffa;' : (result.is_hidden ? 'background:#fef2f2;' : '')}">
                                                                <td class="checkbox-col"><input type="checkbox" class="result-checkbox" data-result-id="${result.id}"></td>
                                                                <td>${this.escapeHtml(result.subject_name)}</td>
                                                                <td><strong>${this.escapeHtml(isEmpty ? '—' : result.subject_grade)}</strong></td>
                                                                <td><span class="${badgeClass}">${badgeText}</span></td>
                                                                <td>${result.is_added_to_total ? '✅ مضاف' : '⚠️ غير مضاف'}</td>
                                                                <td>
                                                                    <button class="toggle-link" onclick="App.toggleResult(${result.id})">${result.is_hidden ? '👁️ إظهار' : '🔒 إخفاء'}</button>
                                                                    <button class="toggle-link" onclick="App.deleteResult(${result.id})" style="background:#fee;color:#c53030;">🗑️ حذف</button>
                                                                </td>
                                                            </tr>
                                                        `;
                                                    }).join('')}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            },

            escapeHtml(text) {
                if (!text) return '';
                return String(text).replace(/[&<>]/g, m => {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            },

            render() {
                const app = document.getElementById('app');
                app.innerHTML = `
                    <div class="header">
                        <div class="header-content">
                            <div class="logo-section">
                                <div class="logo-img">🏫</div>
                                <div>
                                    <div class="logo-text">نظام نتائج مدارس نيو فيجن الخاصة</div>
                                    <div class="subtitle">New Vision Private Schools - لوحة الإدارة</div>
                                </div>
                            </div>
                            <div class="nav-links">
                                <button class="${this.currentTab === 'dashboard' ? 'active' : ''}" data-tab="dashboard">📊 لوحة التحكم</button>
                                <button class="${this.currentTab === 'results' ? 'active' : ''}" data-tab="results">📖 عرض المواد</button>
                                <a href="student.html" class="student-link">🔍 صفحة الاستعلام للطلاب</a>
                                <button id="logoutBtn" class="logout-btn">🚪 تسجيل خروج</button>
                            </div>
                        </div>
                    </div>
                    <div class="container">
                        ${this.currentTab === 'dashboard' ? this.renderDashboard() : this.renderResults()}
                    </div>
                    <div class="footer">
                        <div>👨‍💻 برمجة المهندس / عادل عبدالرحمن</div>
                        <div>📞 للتواصل: <a href="https://wa.me/201158972742" target="_blank">01158972742</a></div>
                        <div>© 2026 جميع الحقوق محفوظة - مدارس نيو فيجن الخاصة</div>
                    </div>
                `;
                this.bindEvents();
            },

            bindEvents() {
                // التبويبات
                document.querySelectorAll('[data-tab]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.currentTab = btn.dataset.tab;
                        if (this.currentTab === 'results') {
                            this.filters = { grade: '', semester: '', year: '', hideFilter: 'all', search: '' };
                        }
                        this.render();
                    });
                });

                // تسجيل الخروج
                document.getElementById('logoutBtn')?.addEventListener('click', () => Auth.logout());

                // رفع الملف
                document.getElementById('uploadBtn')?.addEventListener('click', () => {
                    const file = document.getElementById('excelFile').files[0];
                    const grade = document.getElementById('gradeLevel').value;
                    const semester = document.getElementById('semester').value;
                    const year = document.getElementById('academicYear').value;
                    if (!grade) { this.showMessage('اختر المرحلة', 'error'); return; }
                    if (!file) { this.showMessage('اختر ملف', 'error'); return; }
                    this.uploadExcel(file, grade, semester, year);
                });

                // تصدير قائمة المواد
                document.getElementById('exportSubjectsBtn')?.addEventListener('click', () => this.exportSubjectsList());

                // رفع ملف التحديد
                document.getElementById('uploadUpdateBtn')?.addEventListener('click', () => {
                    const file = document.getElementById('updateFile').files[0];
                    this.uploadSubjectsUpdate(file);
                });

                // تصدير JSON
                document.getElementById('exportJsonBtn')?.addEventListener('click', () => this.exportToJSON());

                // فلتر النتائج
                const filterForm = document.getElementById('filterForm');
                if (filterForm) {
                    filterForm.addEventListener('submit', (e) => {
                        e.preventDefault();
                        const fd = new FormData(e.target);
                        this.filters = {
                            grade: fd.get('grade') || '',
                            semester: fd.get('semester') || '',
                            year: fd.get('year') || '',
                            hideFilter: fd.get('hideFilter') || 'all',
                            search: fd.get('search') || ''
                        };
                        this.render();
                    });
                }

                // إعادة تعيين الفلاتر
                document.getElementById('resetFilters')?.addEventListener('click', () => {
                    this.filters = { grade: '', semester: '', year: '', hideFilter: 'all', search: '' };
                    this.render();
                });

                // الإجراءات الجماعية
                document.getElementById('bulkShowBtn')?.addEventListener('click', () => this.bulkActions('show'));
                document.getElementById('bulkHideBtn')?.addEventListener('click', () => this.bulkActions('hide'));

                // تصدير Excel وطباعة
                document.getElementById('exportExcelBtn')?.addEventListener('click', () => this.exportToExcel());
                document.getElementById('printAllBtn')?.addEventListener('click', () => this.printAllResults());

                // تحديد الكل
                document.getElementById('selectAll')?.addEventListener('change', (e) => {
                    document.querySelectorAll('.result-checkbox').forEach(cb => cb.checked = e.target.checked);
                });
            }
        };

        // تشغيل التطبيق
        App.init();
    </script>
</body>
</html>
